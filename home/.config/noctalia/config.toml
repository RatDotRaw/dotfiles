[theme]
mode    = "dark"
source  = "builtin"
builtin = "Gruvbox"

[shell]
polkit_agent   = true
password_style = "random"

[bar.default]
position    = "top"
background_opacity = 1.0
shadow      = false
radius = 0
thickness   = 40
margin_ends = 0
start = ["launcher", "workspaces", "spacer", "taskbar"]
end = ["audio_visualizer", "media", "sysmon", "tray", "privacy", "bluetooth", "network", "volume", "battery", "session"]

[wallpaper]
directory = "/home/stafd/Pictures/Wallpapers"

[dock]
emabled   = false
position  = "bottom"
show_dots = true

[widget.clock]
format = "{:%H:%M:%S} {:%A %d/%m}"
vertical_format = "{:%H\n%M}"
tooltip_format = "{:%A, %B %d, %Y}"

[widget.privacy]
type           = "privacy"
hide_inactive  = true
icon_spacing   = 6

[widget.cpu]
type = "sysmon"
stat = "cpu_usage"

[widget.volume]
show_label = false